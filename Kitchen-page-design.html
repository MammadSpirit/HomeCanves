    <!-- استایل خطی لودینگ برای اجرای بدون تاخیر -->
    <style>
        #page-loader {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #121212;
            z-index: 999999; /* بیشترین مقدار ممکن */
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        #page-loader.hidden {
            opacity: 0; visibility: hidden; pointer-events: none;
        }
        .loader-circle {
            width: 60px; height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        #page-loader p {
            color: #ffffff; font-family: tahoma, sans-serif; /* از فونت سیستمی استفاده میکنیم که معطل لود فونت وب نشود */
            font-size: 16px; animation: pulseText 1.5s infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulseText { 50% { opacity: 0.5; } }
    </style>

<!-- ============================================================
     Three.js r186 — سیستم Import سازگار با معماری HomeCanvas
     - هسته و addonها فقط از طریق three-bridge.js (ESM)
     - بقیهٔ پروژه همان اسکریپت کلاسیک می‌ماند (بدون type=module)
     - کد قدیمی: window.THREE / THREE.OrbitControls / whenThreeReady
     ============================================================ -->
<script>
/* صف آماده شدن THREE — قبل از bridge؛ اسکریپت‌های کلاسیک می‌توانند ثبت کنند */
window.__threeReadyQueue = window.__threeReadyQueue || [];
window.whenThreeReady = function (cb) {
    if (typeof cb !== 'function') return;
    if (window.THREE && window.THREE.REVISION) {
        try { cb(window.THREE); } catch (e) { console.error(e); }
    } else {
        window.__threeReadyQueue.push(cb);
    }
};
</script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  }
}
</script>
