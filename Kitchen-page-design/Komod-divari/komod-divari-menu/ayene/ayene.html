<div id="closet-ayene-panel" class="kickboard-wrapper">
    <div class="kickboard-header">
        <h3>اضافه کردن ایینه — کمد دیواری</h3>
        <button type="button" class="kickboard-close-btn" onclick="closeAyenePanel()">×</button>
    </div>

    <div class="kickboard-body">
        <div class="kickboard-input-group">
            <label class="kickboard-label">چهارچوب انتخاب‌شده</label>
            <p id="ayene-unit-info" style="font-size:12px;color:#94a3b8;margin:0;line-height:1.5;">
                ابتدا یک چهارچوب را از صحنه انتخاب کنید.
            </p>
        </div>

        <div class="kickboard-input-group">
            <label class="kickboard-label">محل قرارگیری ایینه</label>
            <p style="font-size:12px;color:#94a3b8;margin:0 0 10px;line-height:1.5;">
                سمت یا ناحیه قرارگیری ایینه روی چهارچوب را مشخص کنید.
            </p>
            <div style="display:flex;flex-direction:column;gap:8px;">
                <label style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;border:1px solid #334155;cursor:pointer;background:rgba(255,255,255,0.02);">
                    <input type="radio" name="ayene-placement" value="front" checked onchange="onAyenePlacementChange()">
                    <span style="color:#e2e8f0;font-size:14px;">جلوی چهارچوب (درب / نما)</span>
                </label>
                <label style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;border:1px solid #334155;cursor:pointer;background:rgba(255,255,255,0.02);">
                    <input type="radio" name="ayene-placement" value="inside" onchange="onAyenePlacementChange()">
                    <span style="color:#e2e8f0;font-size:14px;">داخل کمد</span>
                </label>
                <label style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;border:1px solid #334155;cursor:pointer;background:rgba(255,255,255,0.02);">
                    <input type="radio" name="ayene-placement" value="side-left" onchange="onAyenePlacementChange()">
                    <span style="color:#e2e8f0;font-size:14px;">بغل چپ</span>
                </label>
                <label style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;border:1px solid #334155;cursor:pointer;background:rgba(255,255,255,0.02);">
                    <input type="radio" name="ayene-placement" value="side-right" onchange="onAyenePlacementChange()">
                    <span style="color:#e2e8f0;font-size:14px;">بغل راست</span>
                </label>
            </div>
        </div>

        <div class="kickboard-input-group">
            <label class="kickboard-label">ابعاد ایینه (سانتی‌متر)</label>
            <div class="kickboard-grid-2col" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <div>
                    <label class="kickboard-label" style="font-size:11px;color:#94a3b8;">عرض</label>
                    <input type="number" id="ayene-width" class="kickboard-input" min="10" step="0.1" value="40"
                           oninput="onAyeneDimChange()">
                </div>
                <div>
                    <label class="kickboard-label" style="font-size:11px;color:#94a3b8;">ارتفاع</label>
                    <input type="number" id="ayene-height" class="kickboard-input" min="10" step="0.1" value="120"
                           oninput="onAyeneDimChange()">
                </div>
            </div>
        </div>

        <div class="kickboard-input-group">
            <label class="kickboard-label">وضعیت</label>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button type="button" class="kickboard-apply-btn" style="flex:1;min-width:120px;background:#0284c7;"
                        onclick="toggleAyeneEnabled(true)">فعال کردن</button>
                <button type="button" class="kickboard-apply-btn" style="flex:1;min-width:120px;background:#475569;"
                        onclick="toggleAyeneEnabled(false)">غیرفعال</button>
            </div>
            <p id="ayene-status-text" style="font-size:12px;color:#94a3b8;margin:10px 0 0;">وضعیت: غیرفعال</p>
        </div>

        <div class="kickboard-preview-container">
            <label class="kickboard-label" style="display:flex;justify-content:space-between;">
                <span>پیش‌نمایش چهارچوب</span>
                <span style="color:#38bdf8;font-size:11px;">ایینه با رنگ آبی مشخص است</span>
            </label>
            <div id="ayene-preview-wrapper" style="width:100%;height:260px;background:#090d16;border-radius:10px;border:1px solid #1e293b;overflow:hidden;position:relative;">
                <svg id="ayene-preview-svg" style="width:100%;height:100%;display:block;"></svg>
            </div>
        </div>

        <div class="kickboard-actions-container" style="margin-top:15px;">
            <button type="button" onclick="applyAyeneSettings()" class="kickboard-apply-btn">
                ثبت و اعمال ایینه
            </button>
        </div>
    </div>
</div>
