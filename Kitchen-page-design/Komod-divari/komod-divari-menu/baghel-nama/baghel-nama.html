<div id="closet-baghel-nama-panel" class="kickboard-wrapper">
    <div class="kickboard-header">
        <h3>اضافه کردن بغل‌نما — کمد دیواری</h3>
        <button type="button" class="kickboard-close-btn" onclick="closeBaghelNamaPanel()">×</button>
    </div>
    <div class="kickboard-body">
        <div class="kickboard-input-group">
            <label class="kickboard-label">محل قرارگیری روی چهارچوب</label>
            <p style="font-size:12px;color:#94a3b8;margin:0 0 10px;line-height:1.5;">
                سمت چپ یا راست چهارچوب را برای بغل‌نما انتخاب کنید.
            </p>
            <div style="display:flex;flex-direction:column;gap:8px;">
                <label id="baghel-side-left-label"
                       style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-radius:10px;border:1px solid #334155;cursor:pointer;background:rgba(255,255,255,0.02);">
                    <span style="display:flex;align-items:center;gap:10px;">
                        <input type="radio" name="baghel-nama-side" value="left" checked onchange="onBaghelNamaSideChange()">
                        <span style="color:#e2e8f0;font-size:14px;">سمت چپ</span>
                    </span>
                    <span id="baghel-left-status" style="font-size:11px;color:#94a3b8;">غیرفعال</span>
                </label>
                <label id="baghel-side-right-label"
                       style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-radius:10px;border:1px solid #334155;cursor:pointer;background:rgba(255,255,255,0.02);">
                    <span style="display:flex;align-items:center;gap:10px;">
                        <input type="radio" name="baghel-nama-side" value="right" onchange="onBaghelNamaSideChange()">
                        <span style="color:#e2e8f0;font-size:14px;">سمت راست</span>
                    </span>
                    <span id="baghel-right-status" style="font-size:11px;color:#94a3b8;">غیرفعال</span>
                </label>
            </div>
        </div>
        <div class="kickboard-input-group" style="margin-top:8px;">
            <label class="kickboard-label">وضعیت بغل‌نما</label>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button type="button" class="kickboard-apply-btn" style="flex:1;min-width:120px;"
                        onclick="toggleBaghelNamaForSelectedSide(true)">فعال کردن</button>
                <button type="button" class="kickboard-apply-btn" style="flex:1;min-width:120px;background:#475569;"
                        onclick="toggleBaghelNamaForSelectedSide(false)">غیرفعال کردن</button>
            </div>
            <small style="color:#94a3b8;display:block;margin-top:8px;font-size:11px;line-height:1.5;">
                ابتدا چهارچوب را انتخاب کنید، سپس سمت چپ یا راست را مشخص و فعال کنید.
            </small>
        </div>
        <div class="kickboard-actions-container" style="margin-top:12px;">
            <button type="button" onclick="closeBaghelNamaPanel()" class="kickboard-apply-btn" style="background:#475569;">بستن</button>
        </div>
    </div>
</div>
