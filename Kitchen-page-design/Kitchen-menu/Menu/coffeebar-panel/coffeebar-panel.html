<!-- پنل اصلی مدیریت کافه بار -->
<div id="coffeebar-editor-panel" class="coffeebar-panel-wrapper">
    <div class="coffeebar-panel-header">
        <h3>تنظیمات کافه بار</h3>
        <button class="coffeebar-panel-close" onclick="closeCoffeeBarEditorPanel()">&times;</button>
    </div>

        <!-- دکمه فعال سازی کلی کافه بار -->
        <div class="coffeebar-input-group" style="background: rgba(59, 130, 246, 0.1); padding: 15px; border-radius: 10px; border: 1px solid rgba(59, 130, 246, 0.3);">
            <label class="coffeebar-checkbox-label" style="color: #60a5fa !important; font-weight: bold;">
                تبدیل این کابینت به کافه بار
                <input type="checkbox" id="cb-master-toggle" onchange="toggleMasterCoffeeBar(this.checked)">
                <span class="coffeebar-checkmark"></span>
            </label>
        </div>

        <!-- کانتینر تنظیمات اجزا (در صورت فعال شدن کافه بار نمایش داده میشود) -->
        <div id="coffeebar-parts-container" style="display: none;">
            
            <!-- ====== بخش دیواره راست ====== -->
            <div class="coffeebar-part-section">
                <h4>دیواره راست</h4>
                <div class="coffeebar-input-group">
                    <label class="coffeebar-checkbox-label">
                        نمایش دیواره راست
                        <input type="checkbox" id="cb-right-toggle" checked onchange="toggleCbPart('right', this.checked)">
                        <span class="coffeebar-checkmark"></span>
                    </label>
                </div>
                <div class="coffeebar-input-group">
                    <label class="group-title">جنس ورق</label>
                    <select id="cb-right-mat" class="modern-select" onchange="updateCbMaterial('right', this.value)"> 
                        <option value="mdf">MDF (ام دی اف)</option>
                        <option value="highGloss">High-Gloss (هایگلاس)</option>
                        <option value="leteron">Leteron (لترون)</option>
                    </select>
                </div>
                <div class="coffeebar-input-group">
                    <label class="group-title">رنگ</label>
                    <input type="text" id="cb-right-color" onclick="openCoffeeBarMaterialModal('right')" placeholder="انتخاب رنگ دیواره راست..." class="modern-input" autocomplete="off" readonly style="cursor: pointer;">
                        <div>
                            <label class="group-title">پرداخت سطح (نور / براقیت)</label>
                            <select id="cb-right-finish" class="modern-select" onchange="if(typeof onCoffeeBarFinishChange==='function') onCoffeeBarFinishChange('right', this.value)">
                                <option value="matte">مات (Matte)</option>
                                <option value="semiMatte">نیمه‌مات</option>
                                <option value="satin">ساتین</option>
                                <option value="highGloss">براق / های‌گلاس</option>
                            </select>
                        </div>
                </div>

                <!-- 🟢 تنظیمات ترمووال دیواره راست -->
                <div class="coffeebar-thermo-box" style="margin-top: 10px; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 8px; border: 1px dashed #444;">
                    <label class="coffeebar-checkbox-label" style="font-weight: bold; color: #f59e0b;">
                        افزودن ترمووال به دیواره راست
                        <input type="checkbox" id="cb-right-thermo-toggle" onchange="toggleCbThermo('right', this.checked)">
                        <span class="coffeebar-checkmark"></span>
                    </label>
                    
                    <div id="cb-right-thermo-details" style="display: none; margin-top: 10px;">
                        <div class="coffeebar-input-group">
                            <label class="group-title">تعداد ترمووال</label>
                            <input type="number" id="cb-right-thermo-count" value="3" min="1" class="modern-input" onchange="updateCbThermoProp('right', 'count', this.value)">
                        </div>
                        <div class="coffeebar-input-group">
                            <label class="group-title">عمق ترمووال (سانتی‌متر)</label>

                                <option value="highGloss">براق / های‌گلاس</option>
                            </select>
                        </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ====== بخش پیشخوان جلویی (بدون ترمووال) ====== -->
            <div class="coffeebar-part-section">
                <h4>پیشخوان جلویی</h4>
                <div class="coffeebar-input-group">
                    <label class="coffeebar-checkbox-label">
                        نمایش پیشخوان جلویی
                        <input type="checkbox" id="cb-front-toggle" onchange="toggleCbPart('front', this.checked)">
                        <span class="coffeebar-checkmark"></span>
                    </label>
                </div>

                <div id="cb-front-details" style="display: none; padding-left: 20px; border-left: 2px solid #333;">
                    <div class="coffeebar-input-group">
                        <label class="coffeebar-checkbox-label">
                            پیشخوان به صورت نیم‌دایره باشد
                            <input type="checkbox" id="cb-front-curved" onchange="updateCbFrontProperty('isCurved', this.checked)">
                            <span class="coffeebar-checkmark"></span>
                        </label>
                    </div>
                    
                    <div class="coffeebar-input-group" id="cb-front-height-group" style="display: none;">
                        <label class="group-title">ارتفاع ورق نیم‌دایره از سقف (سانتی‌متر)</label>
                        <input type="number" id="cb-front-height" value="80" class="modern-input" onchange="updateCbFrontProperty('height', this.value)">
                    </div>

                    <div class="coffeebar-input-group">
                        <label class="group-title">جنس ورق</label>
                        <select id="cb-front-mat" class="modern-select" onchange="updateCbMaterial('front', this.value)"> 
                            <option value="mdf">MDF (ام دی اف)</option>
                            <option value="highGloss">High-Gloss (هایگلاس)</option>
                            <option value="leteron">Leteron (لترون)</option>
                        </select>
                    </div>
                    <div class="coffeebar-input-group">
                        <label class="group-title">رنگ</label>
                        <input type="text" id="cb-front-color" onclick="openCoffeeBarMaterialModal('front')" placeholder="انتخاب رنگ پیشخوان..." class="modern-input" autocomplete="off" readonly style="cursor: pointer;">
                        <div>
                            <label class="group-title">پرداخت سطح (نور / براقیت)</label>
                            <select id="cb-front-finish" class="modern-select" onchange="if(typeof onCoffeeBarFinishChange==='function') onCoffeeBarFinishChange('front', this.value)">
                                <option value="matte">مات (Matte)</option>
                                <option value="semiMatte">نیمه‌مات</option>
                                <option value="satin">ساتین</option>
                                <option value="highGloss">براق / های‌گلاس</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- دکمه ثبت -->
            <div style="padding: 15px; margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1);">
                <button onclick="applyCoffeeBarSettings()" style="width: 100%; background: #10b981; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px;">اعمال تغییرات</button>
            </div>

        </div>
    </div>
</div>
